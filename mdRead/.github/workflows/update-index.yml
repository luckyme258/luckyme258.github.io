name: Update Books Index

# 触发条件
on:
  # 1. 当你 push 书籍文件到仓库时触发
  push:
    paths:
      - 'mdRead/books/**'        # 只要有书籍文件变化
    branches: [ main ]            # 只在 main 分支

  # 2. 允许手动触发（方便测试）
  workflow_dispatch:

# 权限设置
permissions:
  contents: write                  # 需要写入权限才能更新 index.json

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    steps:
      # 第一步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # 获取完整历史，用于获取文件修改时间

      # 第二步：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # 与你本地 Python 版本一致即可

      # 第三步：生成书籍索引文件
      - name: Generate books index
        run: |
          cd mdRead
          
          # 创建 Python 脚本来生成 index.json
          cat > generate_index.py << 'EOF'
import json
import os
from pathlib import Path
from datetime import datetime

def get_book_meta(book_dir):
    """从书籍目录读取元数据"""
    meta_file = book_dir / 'meta.json'
    if meta_file.exists():
        try:
            with open(meta_file, 'r', encoding='utf-8') as f:
                return json.load(f)
        except:
            pass
    
    # 如果没有 meta.json，从 index.md 提取
    index_file = book_dir / 'index.md'
    if index_file.exists():
        with open(index_file, 'r', encoding='utf-8') as f:
            content = f.read()
            # 简单的标题提取
            title_match = content.split('\n')[0].replace('# ', '').strip()
            return {
                'id': book_dir.name,
                'title': title_match or book_dir.name,
                'author': '未知',
                'total_chapters': 0
            }
    
    return {
        'id': book_dir.name,
        'title': book_dir.name,
        'author': '未知',
        'total_chapters': 0
    }

def main():
    books_dir = Path('books')
    if not books_dir.exists():
        print("书籍目录不存在")
        return
    
    books_list = []
    
    # 遍历每个书籍目录
    for book_dir in sorted(books_dir.iterdir()):
        if not book_dir.is_dir():
            continue
            
        print(f"处理: {book_dir.name}")
        
        # 获取元数据
        meta = get_book_meta(book_dir)
        
        # 获取章节列表
        chapters_dir = book_dir / 'chapters'
        chapters = []
        if chapters_dir.exists():
            chapters = sorted([f.name for f in chapters_dir.glob('*.md')])
        
        # 获取最后修改时间（从 git 历史或文件系统）
        try:
            # 尝试从 git 获取最后提交时间
            import subprocess
            result = subprocess.run(
                ['git', 'log', '-1', '--format=%cd', '--date=short', str(book_dir)],
                capture_output=True, text=True, cwd=os.getcwd()
            )
            last_modified = result.stdout.strip() or datetime.now().strftime('%Y-%m-%d')
        except:
            last_modified = datetime.now().strftime('%Y-%m-%d')
        
        # 构建书籍信息
        book_info = {
            'id': book_dir.name,
            'title': meta.get('title', book_dir.name),
            'author': meta.get('author', '未知'),
            'total_chapters': len(chapters),
            'chapters': chapters[:10],  # 只保存前10章作为预览
            'last_modified': last_modified,
            'has_notes': (book_dir / 'notes').exists()
        }
        
        books_list.append(book_info)
    
    # 写入 index.json
    with open('books/index.json', 'w', encoding='utf-8') as f:
        json.dump(books_list, f, ensure_ascii=False, indent=2)
    
    print(f"✅ 已生成 {len(books_list)} 本书的索引")

if __name__ == '__main__':
    main()
EOF

          # 执行脚本
          python3 generate_index.py

      # 第四步：提交生成的 index.json
      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加 index.json
          git add mdRead/books/index.json
          
          # 检查是否有变化
          if git diff --staged --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "🤖 自动更新书籍索引 [skip ci]"
            git push
          fi
