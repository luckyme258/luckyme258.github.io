<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 半亩书廊 · 书籍列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f2ed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 3rem;
            color: #3e2e21;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .subtitle {
            color: #8b6f4c;
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #f0e4d8;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #3e2e21;
        }
        
        .stat-label {
            color: #8b6f4c;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        
        /* 书籍网格 - 静态生成 */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .book-card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            border: 1px solid #f0e4d8;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(139, 111, 76, 0.15);
            border-color: #cbb295;
        }
        
        .book-emoji {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2b211b;
            margin-bottom: 0.3rem;
            line-height: 1.4;
        }
        
        .book-author {
            color: #8b6f4c;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .footer {
            text-align: center;
            color: #9b8978;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #ebddcf;
            font-size: 0.9rem;
        }
        
        .update-time {
            display: inline-block;
            background: #f0e4d8;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            margin-top: 1rem;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .book-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>
