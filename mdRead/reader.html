<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>阅读器 - 半亩书廊</title>
    <style>
        /* 样式保持不变，省略... 使用之前的完整样式 */
        :root {
            --bg: #ffffff;
            --bg-rgb: 255, 255, 255;
            --text: #2d3748;
            --text-light: #718096;
            --accent: #cbb295;
            --accent-dark: #b58b64;
            --light-accent: #f5ede5;
            --card-bg: #fcf7f1;
            --card-shadow: 0 2px 8px rgba(139, 111, 76, 0.1);
            --border-radius: 12px;
            --line-height: 1.8;
            --container-width: 800px;
            --spacing: 32px;
            --progress-height: 4px;
            --header-height: 80px;
            --nav-height: 70px;
            --sidebar-width: 260px;
        }

        .dark-mode {
            --bg: #1a1a1a;
            --bg-rgb: 26, 26, 26;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --accent: #b58b64;
            --accent-dark: #9b6e48;
            --light-accent: #2d2d2d;
            --card-bg: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.8; transition: background-color 0.3s ease; font-family: "思源黑体", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .progress-bar { position: fixed; top: 0; left: 0; width: 0%; height: 4px; background: linear-gradient(90deg, var(--accent), #cbb295); z-index: 101; transition: width 0.1s ease; pointer-events: none; }
        .header { position: fixed; top: 0; left: 0; right: 0; background-color: rgba(var(--bg-rgb), 0.4); backdrop-filter: blur(11px); border-bottom: 1px solid var(--light-accent); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; min-height: 80px; }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .shelf-links { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .shelf-link { display: flex; align-items: center; gap: 4px; text-decoration: none; color: var(--accent); padding: 8px 4px; transition: transform 0.2s ease; }
        .shelf-link:hover { transform: translateY(-2px); }
        .shelf-icon { font-size: 24px; }
        .shelf-text { font-size: 12px; color: var(--accent); opacity: 0.8; white-space: nowrap; }
        .shelf-divider { color: var(--text-light); font-size: 14px; opacity: 0.5; }
        .book-title { font-size: 18px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .progress-text { font-size: 18px; color: var(--text); opacity: 0.9; white-space: nowrap; font-weight: 550; }
        .theme-toggle { background: rgba(255,255,255,0.2); border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; color: var(--text); font-size: 14px; transition: all 0.3s ease; backdrop-filter: blur(4px); }
        .theme-toggle:hover { background: var(--accent); color: white; }
        .chapter-sidebar { position: fixed; left: 30px; top: 100px; width: 260px; z-index: 85; display: none; overflow-y: auto; max-height: calc(100vh - 150px); }
        @media (min-width: 1200px) { .chapter-sidebar { display: block; } .container { margin-left: 280px; } }
        .sidebar-title { font-size: 16px; font-weight: 600; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--light-accent); position: sticky; top: 0; background-color: var(--bg); z-index: 86; padding-top: 4px; }
        .sidebar-chapters { list-style: none; }
        .sidebar-chapter { margin-bottom: 4px; }
        .sidebar-chapter a { text-decoration: none; color: var(--text); font-size: 14px; padding: 8px 12px; display: block; border-radius: 6px; transition: background-color 0.2s ease; cursor: pointer; }
        .sidebar-chapter.active a { background-color: var(--light-accent); color: var(--accent); font-weight: 600; }
        .container { max-width: 800px; margin: 0 auto; padding: 100px 16px 120px; transition: margin-left 0.3s; }
        .markdown-body { font-size: 18px; line-height: 1.8; }
        .markdown-body h1 { font-size: 2em; border-left: 4px solid var(--accent); padding-left: 20px; margin: 1.5em 0 0.5em; }
        .markdown-body h2 { font-size: 1.5em; margin: 1.2em 0 0.5em; }
        .markdown-body p { margin-bottom: 1.2em; }
        .markdown-body blockquote { border-left: 4px solid var(--accent); padding: 0.5em 1em; margin: 1em 0; background: var(--light-accent); border-radius: 8px; }
        .chapter-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(var(--bg-rgb), 0.4); backdrop-filter: blur(11px); border-top: 1px solid rgba(203, 178, 149, 0.2); padding: 0 16px; display: flex; justify-content: space-between; align-items: center; z-index: 90; }
        .nav-btn { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(203, 178, 149, 0.3); padding: 0 20px; height: 52px; border-radius: 26px; cursor: pointer; color: var(--accent); font-size: 15px; font-weight: 700; min-width: 100px; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover:not(:disabled) { background: var(--accent); color: white; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .mobile-drawer-trigger { position: fixed; left: 0; bottom: calc(70px + 16px); width: 32px; height: 50px; background: rgba(var(--bg-rgb), 0.4); backdrop-filter: blur(11px); border-top-right-radius: 16px; border-bottom-right-radius: 16px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 95; }
        @media (max-width: 1199px) { .mobile-drawer-trigger { display: flex; } }
        .menu-icon { color: var(--accent); font-size: 20px; }
        .drawer-panel { position: fixed; left: 0; top: 0; bottom: 0; width: 80%; max-width: 320px; background: rgba(var(--bg-rgb), 0.95); backdrop-filter: blur(10px); transform: translateX(-100%); transition: transform 0.3s ease; z-index: 100; overflow-y: auto; padding: 20px 0; }
        .drawer-panel.open { transform: translateX(0); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--light-accent); }
        .drawer-title { font-size: 18px; font-weight: 600; color: var(--accent); }
        .drawer-close { width: 32px; height: 32px; border-radius: 16px; background: transparent; border: 1px solid var(--light-accent); color: var(--text); font-size: 18px; cursor: pointer; }
        .drawer-chapters { list-style: none; }
        .drawer-chapter { margin: 2px 0; }
        .drawer-chapter a { text-decoration: none; color: var(--text); display: block; padding: 10px 20px; font-size: 14px; cursor: pointer; }
        .drawer-chapter.active a { background: var(--light-accent); color: var(--accent); font-weight: 600; }
        .drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 99; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .drawer-overlay.active { opacity: 1; visibility: visible; }
        .back-to-top { position: fixed; bottom: calc(70px + 16px); right: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(var(--bg-rgb), 0.4); backdrop-filter: blur(11px); border: 1px solid rgba(203, 178, 149, 0.2); color: var(--accent); font-size: 20px; cursor: pointer; z-index: 91; display: none; align-items: center; justify-content: center; }
        .back-to-top.show { display: flex; }
        .loading { text-align: center; padding: 100px 20px; font-size: 18px; color: var(--text-light); }
        .error { text-align: center; padding: 100px 20px; font-size: 18px; color: #e53e3e; }
        @media (max-width: 768px) { .container { padding: 100px 16px 100px; } .markdown-body { font-size: 16px; } .progress-text::before { content: ""; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    
    <header class="header">
        <div class="header-left">
            <div class="shelf-links">
                <a href="https://luckyme258.github.io/mdRead/" class="shelf-link">
                    <span class="shelf-icon">📚</span>
                    <span class="shelf-text">书架</span>
                </a>
                <span class="shelf-divider">|</span>
                <a href="https://luckyme258.github.io/books/" class="shelf-link">
                    <span class="shelf-icon">📖</span>
                    <span class="shelf-text">书架2</span>
                </a>
            </div>
            <span class="book-title" id="bookTitle">加载中...</span>
        </div>
        <div class="header-right">
            <span class="progress-text" id="progressText">0%</span>
            <button class="theme-toggle" id="themeToggle">🌙 夜间</button>
        </div>
    </header>
    
    <div class="chapter-sidebar" id="sidebar">
        <div class="sidebar-title">📖 目录</div>
        <ul class="sidebar-chapters" id="sidebarChapters"></ul>
    </div>
    
    <div class="container" id="container">
        <div class="loading">📖 加载中...</div>
    </div>
    
    <div class="chapter-nav">
        <button class="nav-btn" id="prevChapter" disabled>← 上一章</button>
        <button class="nav-btn" id="nextChapter" disabled>下一章 →</button>
    </div>
    
    <div class="mobile-drawer-trigger" id="drawerTrigger">
        <span class="menu-icon">☰</span>
    </div>
    <div class="drawer-panel" id="drawerPanel">
        <div class="drawer-header">
            <span class="drawer-title">📖 目录</span>
            <button class="drawer-close" id="drawerClose">✕</button>
        </div>
        <ul class="drawer-chapters" id="drawerChapters"></ul>
    </div>
    <div class="drawer-overlay" id="drawerOverlay"></div>
    
    <button class="back-to-top" id="backToTop">↑</button>

    <script>
        // 解析 URL 参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                book: params.get('book'),
                chapter: params.get('chapter'),
                note: params.get('note')
            };
        }
        
        // 全局状态
        const state = {
            bookId: null,
            currentChapter: 0,
            totalChapters: 0,
            chapters: []
        };
        
        // DOM 元素
        const elements = {
            container: document.getElementById('container'),
            bookTitle: document.getElementById('bookTitle'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            prevBtn: document.getElementById('prevChapter'),
            nextBtn: document.getElementById('nextChapter'),
            themeToggle: document.getElementById('themeToggle'),
            sidebarChapters: document.getElementById('sidebarChapters'),
            drawerChapters: document.getElementById('drawerChapters'),
            drawerTrigger: document.getElementById('drawerTrigger'),
            drawerPanel: document.getElementById('drawerPanel'),
            drawerClose: document.getElementById('drawerClose'),
            drawerOverlay: document.getElementById('drawerOverlay'),
            backToTop: document.getElementById('backToTop')
        };
        
        // 中文数字映射
        const chineseNumbers = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十', '二十一', '二十二', '二十三', '二十四', '二十五'];
        
        // 获取章节文件名（根据序号生成）
        function getChapterFilename(index) {
            const chapterNum = (index + 1).toString().padStart(2, '0');
            const chineseNum = chineseNumbers[index + 1] || (index + 1).toString();
            // 尝试多种可能的文件名格式
            const possibleNames = [
                `${chapterNum}-第${chineseNum}章.md`,
                `${chapterNum}-第一章.md`,  // 第一章特殊处理
                `${chapterNum}.md`
            ];
            return possibleNames;
        }
        
        // 初始化
        async function init() {
            const params = getUrlParams();
            
            if (!params.book) {
                showError('请指定书籍参数');
                return;
            }
            
            state.bookId = decodeURIComponent(params.book);
            
            // 加载元数据
            await loadBookMetadata();
            
            if (state.totalChapters === 0) {
                showError('未找到章节信息');
                return;
            }
            
            // 确定要加载的章节
            let chapterIndex = 0;
            if (params.chapter) {
                let chapterNum = parseInt(params.chapter);
                if (isNaN(chapterNum)) chapterNum = 1;
                chapterIndex = Math.max(0, Math.min(chapterNum - 1, state.totalChapters - 1));
            }
            
            // 加载章节
            await loadChapter(chapterIndex);
            
            // 设置事件监听
            setupEventListeners();
            setupMobileEvents();
            loadThemePreference();
            
            window.addEventListener('scroll', handleScroll);
        }
        
        // 加载元数据
        async function loadBookMetadata() {
            try {
                // 从 meta.json 获取
                const metaUrl = `/mdRead/books/${state.bookId}/meta.json`;
                console.log('加载元数据:', metaUrl);
                
                const response = await fetch(metaUrl);
                if (response.ok) {
                    const meta = await response.json();
                    elements.bookTitle.textContent = meta.title || state.bookId;
                    state.totalChapters = meta.total_chapters || 0;
                    console.log(`元数据加载成功，共 ${state.totalChapters} 章`);
                } else {
                    console.log('meta.json 不存在，尝试从 index.md 解析');
                    await loadFromIndex();
                }
                
                if (state.totalChapters === 0) {
                    throw new Error('无法获取章节数量');
                }
                
                // 构建章节列表
                state.chapters = [];
                for (let i = 0; i < state.totalChapters; i++) {
                    const chapterNum = i + 1;
                    const chineseNum = chineseNumbers[chapterNum] || chapterNum.toString();
                    state.chapters.push({
                        index: i,
                        number: chapterNum,
                        numberStr: chapterNum.toString().padStart(2, '0'),
                        title: `第${chineseNum}章`,
                        filename: `${chapterNum.toString().padStart(2, '0')}-第${chineseNum}章.md`
                    });
                }
                
                // 尝试从 index.md 获取更准确的标题
                await loadChapterTitles();
                
                // 渲染侧边栏
                renderSidebar();
                
            } catch (error) {
                console.error('加载元数据失败:', error);
                showError(`加载失败: ${error.message}`);
            }
        }
        
        // 从 index.md 解析元数据
        async function loadFromIndex() {
            const indexUrl = `/mdRead/books/${state.bookId}/index.md`;
            const response = await fetch(indexUrl);
            if (response.ok) {
                const content = await response.text();
                // 统计章节数量
                const chapterMatches = content.match(/\[.*?\]\(\/mdRead\/reader\.html\?book=[^&]+&chapter=(\d+)\)/g);
                if (chapterMatches) {
                    const chapterNumbers = new Set();
                    chapterMatches.forEach(match => {
                        const numMatch = match.match(/chapter=(\d+)/);
                        if (numMatch) chapterNumbers.add(parseInt(numMatch[1]));
                    });
                    state.totalChapters = Math.max(...chapterNumbers);
                    console.log(`从 index.md 解析到 ${state.totalChapters} 章`);
                }
            }
        }
        
        // 加载章节标题
        async function loadChapterTitles() {
            const indexUrl = `/mdRead/books/${state.bookId}/index.md`;
            const response = await fetch(indexUrl);
            if (response.ok) {
                const content = await response.text();
                // 解析标题和章节号的映射
                const titleRegex = /\[(.*?)\]\(\/mdRead\/reader\.html\?book=[^&]+&chapter=(\d+)\)/g;
                let match;
                while ((match = titleRegex.exec(content)) !== null) {
                    const title = match[1];
                    const chapterNum = parseInt(match[2]);
                    if (chapterNum >= 1 && chapterNum <= state.totalChapters) {
                        state.chapters[chapterNum - 1].title = title;
                        console.log(`第 ${chapterNum} 章标题: ${title}`);
                    }
                }
            }
        }
        
        // 尝试加载章节内容
        async function loadChapter(index) {
            if (index < 0 || index >= state.totalChapters) return;
            
            state.currentChapter = index;
            const chapter = state.chapters[index];
            
            elements.container.innerHTML = '<div class="loading">📖 加载章节中...</div>';
            
            try {
                let markdown = null;
                let loadedUrl = null;
                
                // 尝试多种可能的文件名
                const possibleFiles = [
                    `${chapter.numberStr}-${chapter.title}.md`,
                    `${chapter.numberStr}-第${chineseNumbers[chapter.number]}章.md`,
                    `${chapter.numberStr}-第一章.md`,
                    `${chapter.numberStr}.md`,
                    `chapter-${chapter.numberStr}.md`
                ];
                
                // 清理标题中的特殊字符
                const cleanTitle = chapter.title.replace(/[\\/:*?"<>|]/g, '');
                possibleFiles.unshift(`${chapter.numberStr}-${cleanTitle}.md`);
                
                for (const filename of possibleFiles) {
                    const url = `/mdRead/books/${state.bookId}/chapters/${filename}`;
                    console.log('尝试加载:', url);
                    const response = await fetch(url);
                    if (response.ok) {
                        markdown = await response.text();
                        loadedUrl = url;
                        console.log(`✅ 章节 ${index + 1} 加载成功: ${url}`);
                        break;
                    }
                }
                
                if (markdown) {
                    renderMarkdown(markdown);
                    updateNavigationButtons();
                    updateUrl();
                } else {
                    throw new Error(`无法找到第 ${index + 1} 章的文件<br><br>请检查 chapters 目录`);
                }
                
            } catch (error) {
                console.error('加载章节失败:', error);
                elements.container.innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
            }
        }
        
        // 渲染 Markdown
        function renderMarkdown(markdown) {
            const html = marked.parse(markdown);
            elements.container.innerHTML = `<div class="markdown-body">${html}</div>`;
            
            // 处理工具卡片
            document.querySelectorAll('.tool-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const example = card.querySelector('.tool-example');
                    const expandText = card.querySelector('.tool-expand');
                    if (example) {
                        example.classList.toggle('active');
                        if (expandText) {
                            expandText.textContent = example.classList.contains('active') ? '收起示例' : '查看示例';
                        }
                    }
                });
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 渲染侧边栏
        function renderSidebar() {
            const renderList = (chapters, container, isDrawer = false) => {
                if (!container) return;
                container.innerHTML = '';
                
                chapters.forEach((ch, idx) => {
                    const li = document.createElement('li');
                    li.className = isDrawer ? 'drawer-chapter' : 'sidebar-chapter';
                    if (idx === state.currentChapter) li.classList.add('active');
                    
                    const a = document.createElement('a');
                    a.textContent = ch.title;
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadChapter(idx);
                        if (isDrawer) closeDrawer();
                    });
                    
                    li.appendChild(a);
                    container.appendChild(li);
                });
            };
            
            renderList(state.chapters, elements.sidebarChapters, false);
            renderList(state.chapters, elements.drawerChapters, true);
        }
        
        // 更新导航按钮
        function updateNavigationButtons() {
            elements.prevBtn.disabled = state.currentChapter === 0;
            elements.nextBtn.disabled = state.currentChapter === state.totalChapters - 1;
        }
        
        // 更新 URL
        function updateUrl() {
            const url = new URL(window.location.href);
            url.searchParams.set('chapter', state.currentChapter + 1);
            window.history.pushState({}, '', url);
        }
        
        // 滚动处理
        function handleScroll() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            
            elements.progressBar.style.width = scrolled + '%';
            elements.progressText.textContent = `${Math.round(scrolled)}%`;
            
            if (winScroll > window.innerHeight) {
                elements.backToTop.classList.add('show');
            } else {
                elements.backToTop.classList.remove('show');
            }
        }
        
        // 事件监听
        function setupEventListeners() {
            elements.prevBtn.addEventListener('click', () => {
                if (state.currentChapter > 0) loadChapter(state.currentChapter - 1);
            });
            
            elements.nextBtn.addEventListener('click', () => {
                if (state.currentChapter < state.totalChapters - 1) loadChapter(state.currentChapter + 1);
            });
            
            elements.themeToggle.addEventListener('click', toggleTheme);
            elements.backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'PageDown') {
                    e.preventDefault();
                    if (state.currentChapter < state.totalChapters - 1) loadChapter(state.currentChapter + 1);
                } else if (e.key === 'PageUp') {
                    e.preventDefault();
                    if (state.currentChapter > 0) loadChapter(state.currentChapter - 1);
                }
            });
        }
        
        // 移动端抽屉
        function setupMobileEvents() {
            elements.drawerTrigger.addEventListener('click', openDrawer);
            elements.drawerClose.addEventListener('click', closeDrawer);
            elements.drawerOverlay.addEventListener('click', closeDrawer);
        }
        
        function openDrawer() {
            elements.drawerPanel.classList.add('open');
            elements.drawerOverlay.classList.add('active');
        }
        
        function closeDrawer() {
            elements.drawerPanel.classList.remove('open');
            elements.drawerOverlay.classList.remove('active');
        }
        
        // 主题切换
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            elements.themeToggle.textContent = isDark ? '☀️ 日间' : '🌙 夜间';
            localStorage.setItem('darkMode', isDark ? '1' : '0');
        }
        
        function loadThemePreference() {
            if (localStorage.getItem('darkMode') === '1') {
                document.body.classList.add('dark-mode');
                elements.themeToggle.textContent = '☀️ 日间';
            }
        }
        
        function showError(message) {
            elements.container.innerHTML = `<div class="error">❌ ${message}</div>`;
        }
        
        // 启动
        init();
    </script>
</body>
</html>
