name: 更新雅思词汇目录

on:
  push:
    paths:
      - '雅思词汇/*.md'
    branches:
      - main

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 生成雅思词汇目录文件
        run: |
          cd 雅思词汇
          
          # 使用 printf 避免多余逗号
          printf '[' > ielts_vocab_list.json
          first=true
          for file in $(ls *.md 2>/dev/null | grep -v '^index.md$' | sort); do
            name=$(basename "$file" .md)
            if [ "$first" = true ]; then
              printf '"%s"' "$name" >> ielts_vocab_list.json
              first=false
            else
              printf ',"%s"' "$name" >> ielts_vocab_list.json
            fi
          done
          printf ']' >> ielts_vocab_list.json
          
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 雅思词汇/ielts_vocab_list.json
          git diff --staged --quiet || git commit -m "自动更新雅思词汇目录"
          git push
