name: 更新雅思词汇目录

on:
  push:
    paths:
      - '雅思词汇/**/*.md'
    branches:
      - main

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 生成树形目录 JSON
        run: |
          cd 雅思词汇
          
          # 使用 find 遍历所有 .md 文件，构建树形结构
          cat > build_tree.py << 'EOF'
          import json
          import os
          from pathlib import Path
          
          tree = {}
          
          for md_file in Path('.').rglob('*.md'):
              # 获取相对路径
              rel_path = md_file.relative_to('.')
              # 获取目录路径和文件名
              parts = list(rel_path.parent.parts)
              name = md_file.stem
              
              # 构建树
              current = tree
              for part in parts:
                  if part not in current:
                      current[part] = {}
                  current = current[part]
              
              # 叶子节点存储文件名（用特殊标记）
              if '__files__' not in current:
                  current['__files__'] = []
              current['__files__'].append(name)
          
          # 输出 JSON
          print(json.dumps(tree, ensure_ascii=False, indent=2))
          EOF
          
          python3 build_tree.py > ielts_vocab_list.json
          
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 雅思词汇/ielts_vocab_list.json
          git diff --staged --quiet || git commit -m "自动更新雅思词汇目录（树形）"
          git push
