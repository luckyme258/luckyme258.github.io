name: 更新雅思词汇目录

on:
  push:
    paths:
      - '雅思词汇/*.md'
    branches:
      - main

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 生成目录文件
        run: |
          cd 雅思词汇
          echo '[' > ielts_vocab_list.json
          ls *.md | grep -v index | sed 's/.md$//' | while read name; do
            echo "\"$name\"," >> ielts_vocab_list.json
          done
          echo ']' >> ielts_vocab_list.json
          sed -i '$ s/,$/]/' ielts_vocab_list.json
          
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 雅思词汇/ielts_vocab_list.json
          git diff --staged --quiet || git commit -m "自动更新雅思词汇目录"
          git push
