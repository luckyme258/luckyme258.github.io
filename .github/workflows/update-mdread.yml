name: Update mdRead Books Index
on:
  push:
    paths: ['mdRead/books/**']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd mdRead
          echo "[]" > books/index.json
          for d in books/*/; do
            id=$(basename "$d")
            title=$(cat "$d/meta.json" 2>/dev/null | grep -o '"title":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "$id")
            echo "{\"id\":\"$id\",\"title\":\"$title\"}" >> /tmp/books.json
          done
          jq -s '.' /tmp/books.json > books/index.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdRead/books/index.json
          git diff --staged --quiet || git commit -m "update index" && git push
