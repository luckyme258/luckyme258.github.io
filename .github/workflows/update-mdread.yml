name: Update mdRead Books Index

on:
  push:
    paths:
      - 'mdRead/books/**'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-books-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Generate index
        run: |
          cd mdRead
          python3 -c "
import json
from pathlib import Path
books = []
for d in Path('books').iterdir():
    if d.is_dir():
        m = d/'meta.json'
        meta = json.load(open(m)) if m.exists() else {}
        books.append({'id': d.name, 'title': meta.get('title', d.name)})
json.dump(books, open('books/index.json','w'), ensure_ascii=False, indent=2)
"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mdRead/books/index.json
          git diff --staged --quiet || git commit -m "update index" && git push
