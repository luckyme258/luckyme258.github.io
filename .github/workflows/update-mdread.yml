name: Update mdRead Books Index

on:
  push:
    paths:
      - 'mdRead/books/**'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-books-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate books index.json
        run: |
          cd mdRead
          python3 -c "
import json
from pathlib import Path

books_dir = Path('books')
if not books_dir.exists():
    print('书籍目录不存在')
    exit(0)

books_list = []
for book_dir in sorted(books_dir.iterdir()):
    if not book_dir.is_dir():
        continue
    
    meta = {}
    meta_file = book_dir / 'meta.json'
    if meta_file.exists():
        with open(meta_file, 'r', encoding='utf-8') as f:
            meta = json.load(f)
    
    books_list.append({
        'id': book_dir.name,
        'title': meta.get('title', book_dir.name),
        'author': meta.get('author', '未知')
    })

with open('books/index.json', 'w', encoding='utf-8') as f:
    json.dump(books_list, f, ensure_ascii=False, indent=2)
"

      - name: Commit and push if changed
        run: |
          cd mdRead
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/index.json
          cd ..
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "📚 自动更新 mdRead 书籍索引 [skip ci]"
            git push
          fi
