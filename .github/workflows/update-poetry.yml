name: 更新诗歌目录

on:
  push:
    paths:
      - '诗歌/*.md'          # 只有 .md 文件变化才触发
    branches:
      - main

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 生成诗歌目录文件
        run: |
          cd 诗歌
          echo '[' > poetry_list.json
          ls *.md | grep -v index | sed 's/.md$//' | while read name; do
            echo "\"$name\"," >> poetry_list.json
          done
          echo ']' >> poetry_list.json
          sed -i '$ s/,$/]/' poetry_list.json
          
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 诗歌/poetry_list.json
          git diff --staged --quiet || git commit -m "自动更新诗歌目录"
          git push
