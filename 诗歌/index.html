<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗歌目录 - 自动更新</title>
    <style>
        /* 样式同上，略... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9f6ef;
            color: #2c3e2f;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #d4c5b0;
        }
        h1 { font-size: 2rem; color: #5a3e2b; }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #8b7355;
            text-decoration: none;
        }
        .file-list {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child { border-bottom: none; }
        .file-icon { font-size: 1.5rem; margin-right: 1rem; }
        .file-name a {
            color: #5a3e2b;
            text-decoration: none;
        }
        .file-name a:hover { text-decoration: underline; color: #c47a44; }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #8b7355;
        }
        .count {
            text-align: center;
            margin-top: 1.5rem;
            color: #8b7355;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/luckyme258.github.io/" class="back-link">← 返回首页</a>
    <header>
        <h1>📖 诗歌集</h1>
        <p class="sub">诗是灵魂的低语 · 自动更新目录</p>
    </header>

    <div id="file-list" class="file-list">
        <div class="loading">📡 正在加载诗歌列表...</div>
    </div>
    <div id="count" class="count"></div>
</div>

<script>
    // 请替换为你的 GitHub 用户名和仓库名
    const USERNAME = 'luckyme258';
    const REPO = 'luckyme258.github.io';
    const DIR_PATH = '诗歌';  // 目录名（注意是中文“诗歌”）

    async function fetchPoetryFiles() {
        const listContainer = document.getElementById('file-list');
        const countContainer = document.getElementById('count');
        
        try {
            // 调用 GitHub API 获取目录内容
            const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${encodeURIComponent(DIR_PATH)}`;
            const response = await fetch(apiUrl);
            
            if (!response.ok) throw new Error('无法获取文件列表');
            
            const files = await response.json();
            // 只筛选 .html 文件
            const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.type === 'file');
            
            if (htmlFiles.length === 0) {
                listContainer.innerHTML = '<div class="error">📭 暂无诗歌文件</div>';
                countContainer.textContent = '共 0 首诗歌';
                return;
            }
            
            // 生成文件列表 HTML
            let listHtml = '';
            htmlFiles.forEach(file => {
                const displayName = file.name.replace('.html', '');
                listHtml += `
                    <div class="file-item">
                        <span class="file-icon">📜</span>
                        <div class="file-name"><a href="${file.name}">${displayName}</a></div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = listHtml;
            countContainer.textContent = `共 ${htmlFiles.length} 首诗歌`;
            
        } catch (error) {
            console.error('Error:', error);
            listContainer.innerHTML = '<div class="error">⚠️ 加载失败，请刷新重试</div>';
            countContainer.textContent = '';
        }
    }
    
    fetchPoetryFiles();
</script>
</body>
</html>
