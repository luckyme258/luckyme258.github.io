<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗歌阅读器</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f9f6ef;
            color: #2c3e2f;
            line-height: 1.8;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #8b7355;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .markdown-body {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        /* ========== 表格样式 - 确保边框清晰可见 ========== */
        .markdown-body table {
            border-collapse: collapse;      /* 合并边框，避免双线 */
            width: 100%;
            margin: 1.5rem 0;
            font-size: 0.95rem;
            font-family: inherit;
        }
        
        /* 表格单元格 - 上下左右都有边框 */
        .markdown-body th,
        .markdown-body td {
            border: 1px solid #aaa;         /* 深灰色实线边框，清晰可见 */
            padding: 0.75rem 1rem;
            vertical-align: top;
            text-align: left;
        }
        
        /* 表头样式：深色背景 + 加粗 */
        .markdown-body th {
            background: #e8e0d5;
            font-weight: 700;
            border-bottom: 2px solid #8b7355;  /* 底部加粗强调 */
        }
        
        /* 交替行背景色，更易阅读（可选） */
        .markdown-body tr:nth-child(even) {
            background-color: #faf7f2;
        }
        
        /* 鼠标悬停高亮（可选） */
        .markdown-body tr:hover {
            background-color: #f0eade;
        }
        
        /* 其他 Markdown 元素样式 */
        .markdown-body h1 {
            color: #5a3e2b;
            border-bottom: 2px solid #d4c5b0;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body h2 {
            color: #7a5a3a;
            margin-top: 1.5rem;
        }
        .markdown-body h3, .markdown-body h4 {
            color: #8b6946;
            margin-top: 1.2rem;
        }
        .markdown-body p {
            margin: 1rem 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #d4c5b0;
            padding-left: 1rem;
            color: #7a6a5c;
            font-style: italic;
            margin: 1rem 0;
        }
        .markdown-body pre {
            background: #f5f0e8;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            margin: 1rem 0;
        }
        .markdown-body code {
            background: #f5f0e8;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .markdown-body ul, .markdown-body ol {
            margin: 0.8rem 0 0.8rem 2rem;
        }
        .markdown-body li {
            margin: 0.3rem 0;
        }
        
        .loading, .error {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 16px;
            color: #8b7355;
        }
        .error {
            color: #c44;
        }
        
        /* 移动端适配 */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .markdown-body {
                padding: 1.2rem;
            }
            .markdown-body th,
            .markdown-body td {
                padding: 0.4rem 0.6rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">← 返回诗歌目录</a>
    <div id="content" class="markdown-body">
        <div class="loading">📖 诗卷展开中...</div>
    </div>
</div>

<script>
    // 配置 marked 以支持 GFM 表格
    if (typeof marked !== 'undefined') {
        // marked v4+ 使用 setOptions；v11+ 推荐用 marked.use
        if (typeof marked.setOptions === 'function') {
            marked.setOptions({
                gfm: true,
                tables: true,
                breaks: false
            });
        } else if (typeof marked.use === 'function') {
            marked.use({
                gfm: true,
                tables: true
            });
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const mdFileName = urlParams.get('file');
    
    if (!mdFileName) {
        document.getElementById('content').innerHTML = '<div class="error">❌ 未指定诗歌文件</div>';
    } else {
        fetch(`${mdFileName}.md`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`找不到文件：${mdFileName}.md`);
                }
                return response.text();
            })
            .then(markdown => {
                let html;
                if (typeof marked !== 'undefined') {
                    // marked.parse 可能返回 Promise (v8+) 或 string (旧版)
                    const result = marked.parse(markdown);
                    if (result && typeof result.then === 'function') {
                        return result;
                    } else {
                        html = result;
                    }
                } else {
                    html = `<pre>${escapeHtml(markdown)}</pre>`;
                }
                if (html) {
                    document.getElementById('content').innerHTML = html;
                }
                document.title = `${mdFileName} - 诗歌集`;
                return html;
            })
            .then(renderedHtml => {
                if (renderedHtml && renderedHtml.then) {
                    return renderedHtml;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ 无法加载诗歌<br>
                        <small>${error.message}</small><br><br>
                        💡 请确保 <strong>${mdFileName}.md</strong> 文件存在于 "诗歌" 文件夹中
                    </div>
                `;
            });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
