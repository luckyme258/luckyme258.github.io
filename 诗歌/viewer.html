<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗歌阅读器</title>
    <!-- 使用 marked.js 将 markdown 转为 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f9f6ef;
            color: #2c3e2f;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #8b7355;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .markdown-body {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .markdown-body h1 {
            color: #5a3e2b;
            border-bottom: 2px solid #d4c5b0;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body h2 {
            color: #7a5a3a;
            margin-top: 1.5rem;
        }
        .markdown-body p {
            margin: 1rem 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #d4c5b0;
            padding-left: 1rem;
            color: #7a6a5c;
            font-style: italic;
        }
        .markdown-body pre {
            background: #f5f0e8;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .loading, .error {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 16px;
            color: #8b7355;
        }
        .error {
            color: #c44;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">← 返回诗歌目录</a>
    <div id="content" class="markdown-body">
        <div class="loading">📖 诗卷展开中...</div>
    </div>
</div>

<script>
    // 从 URL 参数获取文件名，例如 ?file=行道树
    const urlParams = new URLSearchParams(window.location.search);
    const mdFileName = urlParams.get('file');
    
    if (!mdFileName) {
        document.getElementById('content').innerHTML = '<div class="error">❌ 未指定诗歌文件</div>';
    } else {
        // 尝试加载对应的 .md 文件
        fetch(`${mdFileName}.md`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`找不到文件：${mdFileName}.md`);
                }
                return response.text();
            })
            .then(markdown => {
                // 使用 marked 解析并渲染 markdown
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;
                // 更新页面标题
                document.title = `${mdFileName} - 诗歌集`;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ 无法加载诗歌<br>
                        <small>${error.message}</small><br><br>
                        💡 请确保 <strong>${mdFileName}.md</strong> 文件存在于 "诗歌" 文件夹中
                    </div>
                `;
            });
    }
</script>
</body>
</html>
