<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思词汇 - 目录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a3a3a;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #b0c4d4;
        }
        h1 {
            font-size: 2rem;
            color: #2c5a5a;
        }
        .sub {
            color: #6a8a8a;
            margin-top: 0.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #6a8a8a;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .tree {
            background: white;
            border-radius: 16px;
            padding: 0.5rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .tree-node {
            list-style: none;
            padding-left: 0;
        }
        .tree-node .node-content {
            display: flex;
            align-items: center;
            padding: 0.6rem 1rem;
            cursor: pointer;
            user-select: none;
            border-radius: 8px;
            margin: 0.1rem 0.5rem;
            transition: background 0.2s;
        }
        .tree-node .node-content:hover {
            background: #f0f6f4;
        }
        .tree-node .toggle-icon {
            width: 24px;
            font-size: 1rem;
            color: #6a8a8a;
        }
        .tree-node .folder-icon {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }
        .tree-node .node-name {
            flex: 1;
            font-weight: 500;
        }
        .tree-node .file-link {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem 0.5rem 2rem;
            text-decoration: none;
            color: #2c5a5a;
            border-radius: 8px;
            margin: 0.1rem 0.5rem;
        }
        .tree-node .file-link:hover {
            background: #f0f6f4;
        }
        .tree-node .file-icon {
            margin-right: 0.5rem;
            font-size: 1rem;
        }
        .tree-node .children {
            padding-left: 1.5rem;
            display: none;
        }
        .tree-node.open > .children {
            display: block;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #6a8a8a;
        }
        .count {
            text-align: center;
            margin-top: 1.5rem;
            color: #6a8a8a;
            font-size: 0.9rem;
        }
        .update-note {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px dashed #b0c4d4;
            font-size: 0.8rem;
            color: #8aa8a8;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回首页</a>
    <header>
        <h1>📚 雅思词汇</h1>
        <p class="sub">每日一组 · 积少成多</p>
    </header>

    <div id="tree-container" class="tree">
        <div class="loading">📡 正在加载目录...</div>
    </div>
    <div id="count" class="count"></div>
    <div class="update-note">✨ 点击文件夹展开/收起 | 新增词汇后自动更新</div>
</div>

<script>
    const timestamp = new Date().getTime();
    const jsonUrl = `/雅思词汇/ielts_vocab_list.json?t=${timestamp}`;
    
    // 递归渲染树（带路径累积）
    function renderTree(node, currentPath = '') {
        if (!node) return '';
        
        const files = node.__files__ || [];
        let html = '<ul class="tree-node" style="padding-left: 0">';
        
        // 渲染子目录
        for (const [key, value] of Object.entries(node)) {
            if (key === '__files__') continue;
            
            const newPath = currentPath ? `${currentPath}/${key}` : key;
            const childHasChildren = Object.keys(value).some(k => k !== '__files__') || (value.__files__ && value.__files__.length > 0);
            
            html += `
                <li>
                    <div class="node-content" onclick="toggleNode(this)">
                        <span class="toggle-icon">${childHasChildren ? '▶' : '•'}</span>
                        <span class="folder-icon">📁</span>
                        <span class="node-name">${escapeHtml(key)}</span>
                    </div>
                    <div class="children">
                        ${renderTree(value, newPath)}
                    </div>
                </li>
            `;
        }
        
        // 渲染当前层级的文件（使用完整路径）
        if (files.length > 0) {
            files.forEach(file => {
                const fullPath = currentPath ? `${currentPath}/${file}` : file;
                html += `
                    <li>
                        <a href="viewer.html?file=${encodeURIComponent(fullPath)}" class="file-link">
                            <span class="file-icon">📖</span>
                            <span>${escapeHtml(file)}</span>
                        </a>
                    </li>
                `;
            });
        }
        
        html += '</ul>';
        return html;
    }
    
    // 切换文件夹展开/收起
    window.toggleNode = function(element) {
        const li = element.closest('li');
        const childrenDiv = li.querySelector('.children');
        const toggleIcon = element.querySelector('.toggle-icon');
        
        if (childrenDiv) {
            const isOpen = li.classList.contains('open');
            if (isOpen) {
                li.classList.remove('open');
                toggleIcon.textContent = '▶';
            } else {
                li.classList.add('open');
                toggleIcon.textContent = '▼';
            }
        }
    };
    
    // 加载数据
    fetch(jsonUrl)
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(treeData => {
            const container = document.getElementById('tree-container');
            
            // 统计文件总数
            let totalFiles = 0;
            function countFiles(node) {
                if (node.__files__) totalFiles += node.__files__.length;
                for (const [key, value] of Object.entries(node)) {
                    if (key !== '__files__' && typeof value === 'object') {
                        countFiles(value);
                    }
                }
            }
            countFiles(treeData);
            
            const html = renderTree(treeData);
            container.innerHTML = html;
            document.getElementById('count').innerHTML = `共 ${totalFiles} 组词汇`;
            
            // 默认展开第一层
            document.querySelectorAll('.tree-node > li > .node-content').forEach(el => {
                const li = el.closest('li');
                const childrenDiv = li.querySelector('.children');
                if (childrenDiv && childrenDiv.children.length > 0) {
                    li.classList.add('open');
                    const toggleIcon = el.querySelector('.toggle-icon');
                    if (toggleIcon) toggleIcon.textContent = '▼';
                }
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('tree-container').innerHTML = `<div class="error">⚠️ 加载失败: ${error.message}</div>`;
        });
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
