<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思词汇 - 目录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a3a3a;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #b0c4d4;
        }
        h1 {
            font-size: 2rem;
            color: #2c5a5a;
        }
        .sub {
            color: #6a8a8a;
            margin-top: 0.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #6a8a8a;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .file-list {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e0ecec;
            transition: background 0.2s;
        }
        .file-item:hover {
            background: #f0f6f4;
        }
        .file-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
        }
        .file-name {
            flex: 1;
        }
        .file-name a {
            color: #2c5a5a;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .file-name a:hover {
            text-decoration: underline;
            color: #c47a44;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #6a8a8a;
        }
        .count {
            text-align: center;
            margin-top: 1.5rem;
            color: #6a8a8a;
            font-size: 0.9rem;
        }
        .update-note {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px dashed #b0c4d4;
            font-size: 0.8rem;
            color: #8aa8a8;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回首页</a>
    <header>
        <h1>📚 雅思词汇</h1>
        <p class="sub">每日一组 · 积少成多</p>
    </header>

    <div id="file-list" class="file-list">
        <div class="loading">📡 正在加载目录...</div>
    </div>
    <div id="count" class="count"></div>
    <div class="update-note">✨ 新增词汇组后，GitHub Actions 会自动更新目录</div>
</div>

<script>
    fetch('ielts_vocab_list.json')
        .then(response => {
            if (!response.ok) throw new Error('目录文件不存在，请等待 GitHub Actions 首次运行');
            return response.json();
        })
        .then(files => {
            if (!files || files.length === 0) {
                document.getElementById('file-list').innerHTML = '<div class="error">📭 暂无词汇文件</div>';
                document.getElementById('count').textContent = '共 0 组词汇';
                return;
            }
            
            let listHtml = '';
            files.forEach(name => {
                listHtml += `
                    <div class="file-item">
                        <span class="file-icon">📖</span>
                        <div class="file-name"><a href="viewer.html?file=${encodeURIComponent(name)}">${escapeHtml(name)}</a></div>
                    </div>
                `;
            });
            
            document.getElementById('file-list').innerHTML = listHtml;
            document.getElementById('count').innerHTML = `共 ${files.length} 组词汇`;
        })
        .catch(error => {
            document.getElementById('file-list').innerHTML = `<div class="error">⚠️ ${error.message}</div>`;
            document.getElementById('count').innerHTML = '';
        });
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
