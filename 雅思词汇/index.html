<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思词汇 - 目录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a3a3a;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #b0c4d4;
        }
        h1 {
            font-size: 2rem;
            color: #2c5a5a;
        }
        .sub {
            color: #6a8a8a;
            margin-top: 0.5rem;
        }
        .tree {
            background: white;
            border-radius: 16px;
            padding: 0.5rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .folder-item, .file-item {
            list-style: none;
        }
        .folder-label {
            display: flex;
            align-items: center;
            padding: 0.6rem 1rem;
            cursor: pointer;
            user-select: none;
            border-radius: 8px;
            margin: 0.1rem 0.5rem;
            transition: background 0.2s;
        }
        .folder-label:hover {
            background: #f0f6f4;
        }
        .toggle-icon {
            width: 24px;
            font-size: 1rem;
            color: #6a8a8a;
        }
        .folder-icon, .file-icon {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }
        .folder-name {
            font-weight: 500;
        }
        .file-link {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem 0.5rem 2rem;
            text-decoration: none;
            color: #2c5a5a;
            border-radius: 8px;
            margin: 0.1rem 0.5rem;
        }
        .file-link:hover {
            background: #f0f6f4;
        }
        .children {
            padding-left: 1.5rem;
            display: none;
        }
        .open > .children {
            display: block;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #6a8a8a;
        }
        .count {
            text-align: center;
            margin-top: 1.5rem;
            color: #6a8a8a;
            font-size: 0.9rem;
        }
        .update-note {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px dashed #b0c4d4;
            font-size: 0.8rem;
            color: #8aa8a8;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>📚 雅思词汇</h1>
        <p class="sub">每日一组 · 积少成多</p>
    </header>

    <div id="tree-container" class="tree">
        <div class="loading">📡 正在加载目录...</div>
    </div>
    <div id="count" class="count"></div>
    <div class="update-note">✨ 点击文件夹展开/收起 | 新增词汇后自动更新</div>
</div>

<script>
    const timestamp = new Date().getTime();
    const jsonUrl = `/雅思词汇/ielts_vocab_list.json?t=${timestamp}`;
    
    // 递归渲染树
    function renderTree(node, currentPath = '') {
        if (!node) return '';
        
        let html = '';
        
        for (const [key, value] of Object.entries(node)) {
            if (key === '__files__') continue;
            
            const newPath = currentPath ? `${currentPath}/${key}` : key;
            const hasChildren = Object.keys(value).some(k => k !== '__files__') || (value.__files__ && value.__files__.length > 0);
            
            html += `
                <li class="folder-item">
                    <div class="folder-label">
                        <span class="toggle-icon">▶</span>
                        <span class="folder-icon">📁</span>
                        <span class="folder-name">${escapeHtml(key)}</span>
                    </div>
                    <div class="children">
                        <ul>
            `;
            
            // 递归渲染子文件夹
            html += renderTree(value, newPath);
            
            // 渲染当前文件夹下的文件
            if (value.__files__ && value.__files__.length > 0) {
                value.__files__.forEach(file => {
                    const fullPath = newPath ? `${newPath}/${file}` : file;
                    html += `
                        <li class="file-item">
                            <a href="viewer.html?file=${encodeURIComponent(fullPath)}" class="file-link">
                                <span class="file-icon">📖</span>
                                <span>${escapeHtml(file)}</span>
                            </a>
                        </li>
                    `;
                });
            }
            
            html += `
                        </ul>
                    </div>
                </li>
            `;
        }
        
        return html;
    }
    
    // 加载数据
    fetch(jsonUrl)
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(treeData => {
            const container = document.getElementById('tree-container');
            
            // 统计文件总数
            let totalFiles = 0;
            function countFiles(node) {
                if (node.__files__) totalFiles += node.__files__.length;
                for (const [key, value] of Object.entries(node)) {
                    if (key !== '__files__' && typeof value === 'object') {
                        countFiles(value);
                    }
                }
            }
            countFiles(treeData);
            
            // 渲染
            const html = `<ul>${renderTree(treeData)}</ul>`;
            container.innerHTML = html;
            document.getElementById('count').innerHTML = `共 ${totalFiles} 组词汇`;
            
            // 绑定点击事件（事件委托）
            container.addEventListener('click', function(e) {
                const folderLabel = e.target.closest('.folder-label');
                if (!folderLabel) return;
                
                const li = folderLabel.closest('.folder-item');
                if (!li) return;
                
                const childrenDiv = li.querySelector(':scope > .children');
                const toggleIcon = folderLabel.querySelector('.toggle-icon');
                
                if (childrenDiv) {
                    const isOpen = li.classList.contains('open');
                    if (isOpen) {
                        li.classList.remove('open');
                        if (toggleIcon) toggleIcon.textContent = '▶';
                    } else {
                        li.classList.add('open');
                        if (toggleIcon) toggleIcon.textContent = '▼';
                    }
                }
            });
            
            // 默认展开所有文件夹
            document.querySelectorAll('.folder-item').forEach(folder => {
                folder.classList.add('open');
                const toggleIcon = folder.querySelector('.toggle-icon');
                if (toggleIcon) toggleIcon.textContent = '▼';
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('tree-container').innerHTML = `<div class="error">⚠️ 加载失败: ${error.message}</div>`;
        });
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
