<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思词汇阅读器</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f0f4f8;
            color: #1a3a3a;
            line-height: 1.8;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #6a8a8a;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .markdown-body {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        
        /* ========== 表格样式（词汇表常用） ========== */
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.5rem 0;
            font-size: 0.95rem;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid #b0c4d4;
            padding: 0.75rem 1rem;
            vertical-align: top;
            text-align: left;
        }
        .markdown-body th {
            background: #e0ecec;
            font-weight: 700;
            border-bottom: 2px solid #8aa8a8;
        }
        .markdown-body tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .markdown-body tr:hover {
            background-color: #eef4f2;
        }
        
        /* 其他样式 */
        .markdown-body h1 {
            color: #2c5a5a;
            border-bottom: 2px solid #b0c4d4;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body h2 {
            color: #3a6a6a;
            margin-top: 1.5rem;
        }
        .markdown-body h3 {
            color: #4a7a7a;
            margin-top: 1.2rem;
        }
        .markdown-body p {
            margin: 1rem 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #b0c4d4;
            padding-left: 1rem;
            color: #6a8a8a;
            font-style: italic;
        }
        .markdown-body pre {
            background: #eef4f2;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .markdown-body code {
            background: #eef4f2;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        .markdown-body ul, .markdown-body ol {
            margin: 0.8rem 0 0.8rem 2rem;
        }
        
        .loading, .error {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 16px;
            color: #6a8a8a;
        }
        .error {
            color: #c44;
        }
        
        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .markdown-body { padding: 1.2rem; }
            .markdown-body th, .markdown-body td { padding: 0.4rem 0.6rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">← 返回词汇目录</a>
    <div id="content" class="markdown-body">
        <div class="loading">📖 加载词汇中...</div>
    </div>
</div>

<script>
    // 配置 marked 支持表格
    if (typeof marked !== 'undefined') {
        if (typeof marked.setOptions === 'function') {
            marked.setOptions({ gfm: true, tables: true, breaks: false });
        } else if (typeof marked.use === 'function') {
            marked.use({ gfm: true, tables: true });
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const mdFileName = urlParams.get('file');
    
    if (!mdFileName) {
        document.getElementById('content').innerHTML = '<div class="error">❌ 未指定词汇文件</div>';
    } else {
        fetch(`${mdFileName}.md`)
            .then(response => {
                if (!response.ok) throw new Error(`找不到文件：${mdFileName}.md`);
                return response.text();
            })
            .then(markdown => {
                if (typeof marked !== 'undefined') {
                    const result = marked.parse(markdown);
                    if (result && typeof result.then === 'function') {
                        return result;
                    } else {
                        document.getElementById('content').innerHTML = result;
                        return result;
                    }
                } else {
                    document.getElementById('content').innerHTML = `<pre>${escapeHtml(markdown)}</pre>`;
                }
            })
            .then(renderedHtml => {
                if (renderedHtml && typeof renderedHtml.then === 'undefined' && renderedHtml !== undefined) {
                    document.getElementById('content').innerHTML = renderedHtml;
                }
                document.title = `${mdFileName} - 雅思词汇`;
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ 无法加载词汇<br>
                        <small>${error.message}</small><br><br>
                        💡 请确保 <strong>${mdFileName}.md</strong> 文件存在于 "雅思词汇" 文件夹中
                    </div>
                `;
            });
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
